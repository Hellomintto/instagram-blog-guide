name: Build prompt PDF
on:
  push:
    paths:
      - 'prompt-source.txt'
      - '.github/workflows/build-prompt-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - name: Generate PDF
        run: |
          python - <<'PY'
          from reportlab.lib.pagesizes import A4
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer
          from reportlab.lib.styles import ParagraphStyle
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.lib import colors
          from reportlab.lib.units import mm
          import html, re
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          pdfmetrics.registerFont(TTFont('DV',font)); pdfmetrics.registerFont(TTFont('DVB',bold))
          doc=SimpleDocTemplate('gpt-audience-analysis-prompt.pdf',pagesize=A4,leftMargin=18*mm,rightMargin=18*mm,topMargin=17*mm,bottomMargin=17*mm)
          title=ParagraphStyle('title',fontName='DVB',fontSize=22,leading=27,spaceAfter=12,textColor=colors.HexColor('#1f1f1f'))
          h=ParagraphStyle('h',fontName='DVB',fontSize=15,leading=19,spaceBefore=12,spaceAfter=7,textColor=colors.HexColor('#B8612B'))
          body=ParagraphStyle('body',fontName='DV',fontSize=10.2,leading=15,spaceAfter=6,textColor=colors.HexColor('#222222'))
          bullet=ParagraphStyle('bullet',parent=body,leftIndent=12,firstLineIndent=-7)
          text=open('prompt-source.txt',encoding='utf-8').read().splitlines()
          story=[]
          for line in text:
              s=line.strip()
              if not s: story.append(Spacer(1,3)); continue
              esc=html.escape(s)
              if s=='АНАЛИЗ ЦА С ПОМОЩЬЮ GPT': story.append(Paragraph(esc,title))
              elif re.match(r'^Часть \d+[\.:]',s): story.append(Paragraph(esc,h))
              elif s.startswith(('- ','— ')): story.append(Paragraph('• '+html.escape(s[2:]),bullet))
              else: story.append(Paragraph(esc,body))
          doc.build(story)
          PY
      - name: Commit PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gpt-audience-analysis-prompt.pdf
          git diff --cached --quiet || (git commit -m 'Generate GPT audience analysis prompt PDF' && git push)
